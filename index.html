<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SV Scan</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --ink:#1b1f24; --muted:#5f6b7a; --line:#d9dee5; --bg:#f4f6f8;
            --brand:#1c6fa8; --accent:#47a8e5; --black:#0a0a0a; --warn:#b3261e; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color:var(--ink); background:var(--bg); }
    header { background:var(--black); color:#fff; padding:10px 16px 12px; border-bottom:4px solid var(--accent);
             display:flex; align-items:center; gap:12px; }
    header img { height:44px; width:auto; display:block; }
    header .title { font-weight:700; font-size:18px; letter-spacing:.5px; color:var(--accent); }
    main { padding:12px 16px 40px; max-width:560px; margin:0 auto; }
    #reader { border-radius:10px; overflow:hidden; background:#000; min-height:200px; }
    .msg { margin-top:12px; padding:12px; border-radius:10px; font-size:15px; background:#e8f3fb; color:#15547f; }
    .msg.err { background:#fce8e6; color:var(--warn); }
    .btn { display:block; text-align:center; text-decoration:none; font-size:17px; padding:13px 14px;
           border-radius:10px; font-weight:600; margin-top:12px; background:#fff; color:var(--brand);
           border:1px solid var(--brand); }
  </style>
</head>
<body>
  <header>
    <img src="https://seviervapor.com/images/logo.jpg" alt="Sevier Vapor">
    <div class="title">SCAN</div>
  </header>
  <main>
    <div id="reader"></div>
    <div id="msg" class="msg">Starting the camera…</div>
    <a id="back" class="btn" href="#">Back to the count app</a>
  </main>

<script>
  // Sends the scanned barcode back to the SV Count app. The count app itself
  // runs in Google's protected frame, which cannot open the live camera.
  var APP = 'https://script.google.com/a/macros/seviervapor.com/s/AKfycbywqfjOQD2L0qpP_404_0o86y2Mgi0eHyf0761A6woAB0Ce3X0TcJTVifHz4MYvgnhcww/exec';
  var params = new URLSearchParams(location.search);
  var store = params.get('store') || '';
  if (!/^[0-9a-f-]{36}$/i.test(store)) store = '';
  var done = false;
  var scanner = null;

  function $(id) { return document.getElementById(id); }
  function msg(text, err) { $('msg').textContent = text; $('msg').className = 'msg' + (err ? ' err' : ''); }
  function appLink(code) {
    var q = [];
    if (store) q.push('store=' + encodeURIComponent(store));
    if (code) q.push('code=' + encodeURIComponent(code));
    return APP + (q.length ? '?' + q.join('&') : '');
  }
  $('back').href = appLink('');

  function onScan(text) {
    if (done) return;
    done = true;
    var code = String(text || '').trim().slice(0, 64);
    msg('Got ' + code + '. Opening the count app…');
    if (navigator.vibrate) navigator.vibrate(80);
    var go = function () { location.replace(appLink(code)); };
    scanner.stop().then(go, go);
  }

  function start(cameraConfig, config) {
    return scanner.start(cameraConfig, config, onScan, function () {});
  }

  if (typeof Html5Qrcode === 'undefined') {
    msg('The scanner did not load. Check the connection and reload this page.', true);
  } else {
    var F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [F.UPC_A, F.UPC_E, F.EAN_13, F.EAN_8, F.CODE_128, F.CODE_39, F.QR_CODE],
      verbose: false,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    var box = function (w, h) {
      return { width: Math.floor(w * 0.9), height: Math.max(80, Math.floor(Math.min(h * 0.5, w * 0.45))) };
    };
    var ready = function () { msg('Point the camera at the barcode and hold steady, about 6 inches away.'); };
    // Ask for a sharper picture first (thin barcodes read better); fall back to the default camera.
    start({ facingMode: 'environment' }, {
      fps: 15, qrbox: box,
      videoConstraints: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    }).then(ready).catch(function () {
      return start({ facingMode: 'environment' }, { fps: 15, qrbox: box }).then(ready);
    }).catch(function () {
      msg('The camera is blocked. On iPhone: tap "aA" in the address bar, then Website Settings, ' +
          'set Camera to Allow, and reload this page.', true);
    });
  }
</script>
</body>
</html>
